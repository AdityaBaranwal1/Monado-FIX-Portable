; Seed for build\ReShade.ini (docs/DLSS5.md). ReShade's Vulkan layer only loads into a process whose folder has a
; ReShade.ini - without it the loader reports error 1114. ReShade and the add-ons add their own keys on first run.
[GENERAL]
NoReloadOnInit=0

[INPUT]
KeyOverlay=36,0,0,0

[OVERLAY]
TutorialProgress=4

[RenoDX.DLSS5]
EnableHooks=2
NeuralUplift=1
NREnableUpscaling=0
NRVulkanPresent=1
